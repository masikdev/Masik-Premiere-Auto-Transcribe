
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CaptionFlow AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #202020;
      color: #f5f5f5;
      font-size: 13px;
    }

    h1 {
      margin: 0;
      font-size: 23px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: #aaa;
      margin: 6px 0 22px;
    }

    .section {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    select,
    input,
    button {
      width: 100%;
      min-height: 36px;
      padding: 9px;
      border-radius: 5px;
      font: inherit;
    }

    select,
    input {
      background: #303030;
      border: 1px solid #505050;
      color: #fff;
    }

    button {
      border: none;
      cursor: pointer;
      font-weight: bold;
      background: #8c69ff;
      color: white;
    }

    button:focus,
    select:focus,
    input:focus {
      outline: 2px solid #b4a0ff;
      outline-offset: 2px;
    }

    button.secondary {
      margin-top: 8px;
      background: #3b3b3b;
      border: 1px solid #606060;
    }

    .status {
      padding: 12px;
      margin-top: 20px;
      border: 1px solid #454545;
      border-radius: 6px;
      background: #292929;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .status-title {
      color: #b4a0ff;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .note {
      color: #aaa;
      font-size: 11px;
      line-height: 1.5;
      margin-top: 7px;
    }
  </style>
</head>

<body>
  <header>
    <h1>CaptionFlow AI</h1>
    <p class="subtitle">AI-powered transcription for Premiere Pro</p>
  </header>

  <section class="section">
    <label for="provider">AI Provider</label>
    <select id="provider">
      <option value="groq">Groq</option>
      <option value="openai">OpenAI</option>
    </select>
  </section>

  <section class="section">
    <label for="apiKey">API Key</label>
    <input
      id="apiKey"
      type="password"
      placeholder="Enter your API key"
      autocomplete="off"
    />
    <p class="note">
      Prototype only. The key is not sent or saved by this version.
    </p>
  </section>

  <section class="section">
    <label for="language">Language</label>
    <select id="language">
      <option value="auto">Auto Detect</option>
      <option value="id">Indonesian</option>
      <option value="en">English</option>
    </select>
  </section>

  <section class="section">
    <label for="captionType">Caption Type</label>
    <select id="captionType">
      <option value="short">Short</option>
      <option value="long">Long</option>
    </select>
  </section>

  <section class="section">
    <label for="maxWords">Maximum Words Per Caption</label>
    <input
      id="maxWords"
      type="number"
      min="2"
      max="15"
      value="5"
    />
  </section>

  <section class="section">
    <button id="testButton">Test Extension</button>
    <button id="resetButton" class="secondary">
      Reset Settings
    </button>
  </section>

  <div class="status" role="status" aria-live="polite">
    <div class="status-title">Status</div>
    <div id="statusMessage">CaptionFlow AI is ready.</div>
  </div>

  <script src="index.js"></script>
</body>
</html>
